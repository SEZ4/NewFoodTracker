<!DOCTYPE html>
<html lang="en">
<head>
    <title>Qais's Food Tracker</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="../public/img/FoodTrackerIcon.png" rel="icon" type="image/x-icon">
    <link href="../public/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">

    <script src="../public/script.js" defer></script>
    <script src="../public/dynmicEvents.js" defer></script>

</head>
<body>
    <div class="body">
        <div class="controlPanel">
            <div class="controlPanel-left">
                <div>
                    <div>
                        <button id="addform-button">+</button>
                    </div>
                    <div class="addform-form">
                        <form>
                            <input type="text" placeholder="First Meal" name="addform-firstMeal" required>
                            <input type="text" placeholder="Second Meal" name="addform-secondMeal">
                            <input type="number" placeholder="Meal Calories" name="addForm-mealCalories" required>
                            <input type="date" name="addform-todayDate" required>
                            <button type="submit" id="addform-submit">✔</button>
                            <!--Make Styles Better also make the Edit List-->
                        </form>
                    </div>
                </div>
                <div>
                    <div>
                        <button id="infoform-button">𝒊</button>
                    </div>
                    <div class="infoform-list">
                        <ul>
                            <li>something</li>
                            <li>another something</li>
                            <li>spmething</li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="controlPanel-right">
                <button>Edit</button>
                <button>Clear content</button>
            </div>
        </div>
        <div class="infoPanel">
            <div class="infoPanel-panel">
                <div>
                    <ul>
                        <li class="cell-headers">First Meal</li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                </div>
                <div>
                    <ul>
                        <li class="cell-headers">Second Meal</li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                </div>
                <div class="block-cell">
                </div>
                <div>
                    <ul>
                        <li class="cell-headers">Today Calorie</li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                </div>
                <div>
                    <ul class="days-cellList">
                        <li class="cell-headers">Days</li>
                        <li>Sunday</li>
                        <li>Monday</li>
                        <li>Tuesday</li>
                        <li>Wednesday</li>
                        <li>Thursday</li>
                        <li>Friday</li>
                        <li>Saturday</li>
                    </ul>
                </div>
                <div class="infoPanel-info">
                    <div>
                        <p>Daily Calorie</p>
                        <p id="daily-calorieCount">1500 Ca</p>
                    </div>
                    <div>
                        <p>Current Weight</p>
                        <p id="curent-weightCount">111.4 Kg</p>
                    </div>
                </div>
            </div>
        </div>
        <footer>
            <p>A <span><span>P</span>lot<span>P</span>oint</span> project</p>
            <p>Made by Qais Ashram</p>
        </footer>
    </div>
</body>
</html>
